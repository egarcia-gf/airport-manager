<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirportManager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Figtree', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
    <nav class="bg-blue-800 text-white px-8 py-4 flex items-center gap-8 shadow-lg">
        <a href="/" class="font-bold text-xl tracking-wide">✈️ AirportManager</a>
        <a href="/favoritos/" class="font-medium hover:text-blue-200 transition">Mis Favoritos</a>
        <a href="/distancia/" class="font-medium hover:text-blue-200 transition">Calcular Distancia</a>
        <a href="/comparar/" class="font-medium hover:text-blue-200 transition">Compara los Aeropuertos</a>
    </nav>
    <main class="max-w-5xl mx-auto mt-10 px-4 pb-10">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
